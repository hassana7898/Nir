name: Build NIR Portable Windows Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-local:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nir_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: production
      PORT: 4001

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Node and npm
        run: |
          node --version
          npm --version
      - name: Install dependencies with npm ci
        run: npm ci --legacy-peer-deps
      - name: Build web
        run: npm run build:web
      - name: Bundle production server
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=bundle --external:pg-native --external:vite --sourcemap --outfile=dist/server.cjs
      - name: Apply real PostgreSQL schema
        run: npm run db:migrate
      - name: Run API tests
        run: npm test
      - name: Real PostgreSQL production smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/health.json /tmp/index.html /tmp/app.js /tmp/nir-server.log
          node dist/server.cjs > /tmp/nir-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          HEALTH_OK=false
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:4001/api/health >/tmp/health.json; then HEALTH_OK=true; break; fi
            sleep 0.2
          done
          if [ "$HEALTH_OK" != "true" ]; then cat /tmp/nir-server.log || true; exit 1; fi
          test "$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/health.json'));process.stdout.write(String(x.service))")" = "nir-production"
          curl -fsS http://127.0.0.1:4001/ >/tmp/index.html
          grep -q '<html' /tmp/index.html
          ASSET=$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/index.html | head -1 | sed 's/src="//;s/"//')
          test -n "$ASSET"
          curl -fsS "http://127.0.0.1:4001${ASSET}" >/tmp/app.js
          test -s /tmp/app.js
          echo "Real PostgreSQL production smoke test passed."
      - name: Bundle server and prepare portable Windows runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release runtime-temp node-win.zip
          mkdir -p release/dist release/runtime
          cp -R dist/. release/dist/
          cp dist/server.cjs release/server.cjs
          NODE_VERSION="$(node -p 'process.versions.node')"
          curl --fail --location --retry 3 --retry-delay 2 "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip" --output node-win.zip
          unzip -q node-win.zip -d runtime-temp
          cp -R "runtime-temp/node-v${NODE_VERSION}-win-x64/." release/runtime/
          rm -rf runtime-temp node-win.zip
          cat > release/start-nir.bat <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist "%~dp0runtime\node.exe" (echo NIR portable Node runtime was not found.&pause&exit /b 1)
          if not exist "%~dp0server.cjs" (echo NIR server package was not found.&pause&exit /b 1)
          if not exist "%~dp0.env" copy /y "%~dp0.env.example" "%~dp0.env" >nul
          set NODE_ENV=production
          "%~dp0runtime\node.exe" "%~dp0server.cjs"
          pause
          EOF
          cat > release/install-nir.bat <<'EOF'
          @echo off
          setlocal
          set "TARGET=C:\NIR"
          if not exist "%TARGET%" mkdir "%TARGET%"
          robocopy "%~dp0" "%TARGET%" /E /R:2 /W:2 /XF install-nir.bat >nul
          echo NIR installed to %TARGET%
          echo Start it with %TARGET%\start-nir.bat
          pause
          EOF
          cp .env.example release/.env.example
          cat > release/README.txt <<'EOF'
          NIR - Portable Windows Local Server

          1. Run install-nir.bat once. This installs to C:\NIR.
          2. Configure C:\NIR\.env with the PostgreSQL connection.
          3. Run C:\NIR\start-nir.bat.

          This package does not require npm, npm install, or node_modules on the factory PC.
          The Node.js Windows runtime is included in the package.
          EOF
      - name: Validate portable package
        shell: bash
        run: |
          set -euo pipefail
          node --check release/server.cjs
          test -f release/dist/index.html
          test -f release/dist/server.cjs
          test -f release/runtime/node.exe
          test -f release/start-nir.bat
          test -f release/install-nir.bat
      - name: Portable runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/portable-health.json /tmp/portable-index.html /tmp/nir-portable.log
          PORT=4002 release/runtime/node.exe release/server.cjs > /tmp/nir-portable.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          HEALTH_OK=false
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:4002/api/health >/tmp/portable-health.json; then HEALTH_OK=true; break; fi
            sleep 0.2
          done
          if [ "$HEALTH_OK" != "true" ]; then cat /tmp/nir-portable.log || true; exit 1; fi
          test "$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/portable-health.json'));process.stdout.write(String(x.service))")" = "nir-production"
          curl -fsS http://127.0.0.1:4002/ >/tmp/portable-index.html
          grep -q '<html' /tmp/portable-index.html
          echo "Portable Windows server smoke test passed."
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: nir-portable-windows
          path: release/
          if-no-files-found: error
          retention-days: 30
