name: Build NIR Production Windows Package

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PG_PASSWORD: nirCiPass123

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nirCiPass123
          POSTGRES_DB: nir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:nirCiPass123@localhost:5432/nir_test
      JWT_SECRET: ci-only-secret-key-not-used-in-production-0123456789
      NODE_ENV: production
      PORT: 4001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web + server bundle
        run: npm run build

      - name: Bundle database migration
        run: npx esbuild server/db/migrate.ts --bundle --platform=node --format=cjs --packages=bundle --external:pg-native --outfile=dist/db-migrate.cjs

      - name: Apply PostgreSQL schema (real database)
        run: npm run db:migrate

      - name: Unit + integration tests (real PostgreSQL)
        run: npm test

      - name: Production smoke test
        shell: bash
        run: |
          set -uo pipefail
          pkill -f 'dist/server.cjs' 2>/dev/null || true
          sleep 1
          PORT=4010 NIR_DIST_PATH="$PWD/dist" node dist/server.cjs >/tmp/nir.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4010/api/health" -o /tmp/health.json 2>/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then echo '--- server log ---'; cat /tmp/nir.log; exit 1; fi
          node -e "const h=require('/tmp/health.json'); if(h.status!=='ok'||h.database.status!=='connected'){console.error(h);process.exit(1)}"
          curl -fsS "http://127.0.0.1:4010/" -o /tmp/index.html
          grep -q '<html' /tmp/index.html
          grep -q '/assets/' /tmp/index.html
          JS=$(grep -oE '/assets/[^\"]+\.js' /tmp/index.html | head -1)
          CSS=$(grep -oE '/assets/[^\"]+\.css' /tmp/index.html | head -1)
          test -n "$JS"
          test -n "$CSS"
          curl -fsS "http://127.0.0.1:4010${JS}" -o /tmp/app.js
          curl -fsS "http://127.0.0.1:4010${CSS}" -o /tmp/app.css
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4010/assets/does-not-exist-9999.js")
          test "$code" = "404"
          code2=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4010/some-spa-route")
          test "$code2" = "200"
          echo 'Production smoke test passed.'

      - name: Assemble NIR-Factory-Production-Windows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release runtime-temp node-win.zip NIR-Factory-Production-Windows.zip
          mkdir -p release/dist release/deploy release/data/uploads release/data/backups release/data/config

          cp -R dist/. release/dist/
          cp release/dist/server.cjs release/server.cjs
          cp release/dist/db-migrate.cjs release/db-migrate.cjs
          rm -f release/dist/server.cjs release/dist/server.cjs.map release/dist/db-migrate.cjs
          cp .env.example release/.env.example
          cp -R deploy/. release/deploy/

          # Root-level operator scripts (mirrors deploy/windows)
          for f in INSTALL-NIR.ps1 INSTALL-INTERNET.ps1 BACKUP-NIR.ps1 RESTORE-NIR.ps1 UNINSTALL-NIR.ps1 NIR-HEALTH.ps1 START-NIR.bat STOP-NIR.bat RESTART-NIR.bat README-FACTORY.txt; do
            cp "deploy/windows/$f" "release/$f"
          done

          # Bundled Windows Node runtime (no system Node needed on the factory PC)
          NODE_VER="$(node -p 'process.versions.node')"
          curl -fsSL --retry 3 "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-win-x64.zip" -o node-win.zip
          mkdir -p runtime-temp
          unzip -q node-win.zip -d runtime-temp
          mkdir -p release/runtime
          cp -R "runtime-temp/node-v${NODE_VER}-win-x64/." release/runtime/
          rm -rf runtime-temp node-win.zip

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          node --check release/server.cjs
          node --check release/db-migrate.cjs
          test -f release/runtime/node.exe
          test -f release/dist/index.html
          test -d release/dist/assets
          test -f release/INSTALL-NIR.ps1
          test -f release/INSTALL-INTERNET.ps1
          test -f release/NIR-HEALTH.ps1
          test -f release/START-NIR.bat
          test -f release/README-FACTORY.txt
          test -f release/deploy/windows/_nir-common.ps1
          test -f release/deploy/windows/RUN-NIR.ps1
          test -f release/deploy/windows/NIR-DDNS.ps1
          test ! -f release/dist/server.cjs
          test ! -f release/.env
          (cd release && zip -qr ../NIR-Factory-Production-Windows.zip .)
          test -f NIR-Factory-Production-Windows.zip
          unzip -l NIR-Factory-Production-Windows.zip | grep -q 'runtime/node.exe'

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: nir-production-windows
          path: NIR-Factory-Production-Windows.zip
          if-no-files-found: error
          retention-days: 30

  windows-runtime:
    name: Validate Windows runtime
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download production package
        uses: actions/download-artifact@v4
        with:
          name: nir-production-windows

      - name: Extract package
        shell: pwsh
        run: Expand-Archive -LiteralPath 'NIR-Factory-Production-Windows.zip' -DestinationPath 'release' -Force

      - name: Validate bundled runtime and bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'release\runtime\node.exe')) { throw 'Missing runtime\node.exe' }
          & 'release\runtime\node.exe' --version
          & 'release\runtime\node.exe' --check 'release\server.cjs'
          & 'release\runtime\node.exe' --check 'release\db-migrate.cjs'
          if (-not (Test-Path 'release\dist\index.html')) { throw 'Missing frontend' }
          if (-not (Test-Path 'release\INSTALL-NIR.ps1')) { throw 'Missing installer' }
          # Parse-check all PowerShell deployment scripts
          $failed = 0
          Get-ChildItem -Path release -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { Write-Host "PARSE ERROR: $($_.Name)"; $errors | ForEach-Object { Write-Host "  $_" }; $failed++ }
          }
          if ($failed -gt 0) { throw "$failed PowerShell script(s) failed to parse." }

      - name: Windows runtime smoke test (no database)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NODE_ENV = 'production'
          $env:PORT = '4099'
          $env:NIR_DIST_PATH = (Resolve-Path 'release\dist').Path
          Remove-Item Env:DATABASE_URL -ErrorAction SilentlyContinue
          $node = (Resolve-Path 'release\runtime\node.exe').Path
          $server = (Resolve-Path 'release\server.cjs').Path
          $proc = Start-Process -FilePath $node -ArgumentList @($server) -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $r = Invoke-WebRequest 'http://127.0.0.1:4099/api/health' -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 503 -or $r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) { throw 'Server did not respond on the Windows runtime.' }
            $html = Invoke-WebRequest 'http://127.0.0.1:4099/' -UseBasicParsing
            if ($html.StatusCode -ne 200) { throw "Frontend returned HTTP $($html.StatusCode)." }
            if ($html.Content -notmatch '<html') { throw 'Frontend HTML was not served.' }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
